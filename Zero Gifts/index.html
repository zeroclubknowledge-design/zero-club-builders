    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("zero-theme") || "null");
          if (!t) return;
          var dark = t.mode === "on" || (t.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark", t.theme || "lights-out");
        } catch (e) {}
      })();
    </script>
