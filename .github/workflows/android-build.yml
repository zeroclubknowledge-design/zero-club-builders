name: Build Android App

# Produces a signed APK and AAB from the PWA using Bubblewrap.
#
# This workflow never publishes to Google Play. Artefacts are uploaded for you
# to download and submit yourself.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of android/android.keystore
#                              generate with: node scripts/write-assetlinks.mjs --print-secret
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_PASSWORD       the key password (same as above unless changed)
#
# Without those secrets the workflow still runs and produces an UNSIGNED build,
# which is enough to prove the project compiles.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Bump version.json and commit it before building"
        required: false
        default: "none"
        type: choice
        options: [none, patch, minor, major]
      skip_signing:
        description: "Build unsigned (no keystore needed)"
        required: false
        default: false
        type: boolean
  push:
    # Tagging v1.2.3 builds exactly what that tag points at.
    tags:
      - "v*"

# One Android build at a time. Two concurrent runs could consume the same
# versionCode and produce two different artefacts claiming to be one release.
concurrency:
  group: android-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # `contents: write` is needed only by the optional "Bump and commit version"
    # step, which pushes the new version.json back so local and CI builds agree
    # on what has been published. GitHub does not allow expressions in
    # `permissions`, so this cannot be narrowed per-run. Nothing else in this
    # job writes to the repository.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 exactly. Bubblewrap 1.25 reads <JDK>/release and rejects anything
      # that is not JAVA_VERSION="17.0...", including 21.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Bubblewrap shells out to build-tools 36.1.0 for zipalign and apksigner,
      # and the generated project compiles against SDK 36. Installing both here
      # keeps licence prompts out of the build step.
      - name: Install Android build tools
        run: sdkmanager --install "build-tools;36.1.0" "platforms;android-36"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gives build-android.mjs a locally built web manifest to embed, so the
      # APK reflects this commit rather than whatever is currently deployed.
      # Non-fatal: if the web build breaks, the Android build carries on and
      # falls back to the deployed manifest with a warning.
      - name: Build web app
        id: web
        continue-on-error: true
        run: npm run build:vercel

      - name: Bump and commit version
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'none'
        run: |
          node scripts/bump-version.mjs "${{ inputs.release }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Release Android $(node -p "require('./version.json').versionName")"
          git push

      - name: Read version
        id: version
        run: |
          echo "name=$(node -p "require('./version.json').versionName")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./version.json').versionCode")" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        id: keystore
        if: ${{ !inputs.skip_signing }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - building unsigned."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/android.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK and AAB
        if: steps.keystore.outputs.available == 'true'
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/build-android.mjs

      - name: Build unsigned APK and AAB
        if: steps.keystore.outputs.available != 'true'
        run: node scripts/build-android.mjs --skip-signing

      # always(), so a failure anywhere above cannot leave the key on disk.
      - name: Shred keystore
        if: always()
        run: shred -u android/android.keystore 2>/dev/null || rm -f android/android.keystore

      - name: Check artefacts carry no key material
        run: |
          if find android/out -name '*.keystore' -o -name '*.jks' -o -name 'keystore.properties' | grep -q .; then
            echo "::error::Key material found in android/out - refusing to upload."
            exit 1
          fi
          ls -la android/out

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: zero-club-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            android/out/*.apk
            android/out/*.aab
            android/out/build-info.json
            android/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Zero Club Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo "| Signed | \`${{ steps.keystore.outputs.available == 'true' }}\` |"
            echo "| Web manifest | \`${{ steps.web.outcome == 'success' && 'from this commit' || 'from the deployed site' }}\` |"
            echo ""
            if [ -f android/out/SHA256SUMS.txt ]; then
              echo '```'
              cat android/out/SHA256SUMS.txt
              echo '```'
            fi
            echo ""
            echo "Upload the \`.aab\` to the Play Console. If the installed app shows a"
            echo "browser URL bar, the fingerprint in \`/.well-known/assetlinks.json\` does"
            echo "not match the key that signed it - see \`android/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
