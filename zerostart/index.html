<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f5" />
    <title>ZeroStart — Zero Ambassadors</title>
    <meta name="description" content="Zero Ambassadors run campaigns that bring people to Zero Club and its partners, and get paid weekly or monthly with volume bonuses." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.zeroclubs.xyz/api/og/default/brand" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zero Start" />
    <meta name="twitter:description" content="Join Zero Club campaigns and grow as a Zero Ambassador." />
    <meta name="twitter:image" content="https://www.zeroclubs.xyz/api/og/default/brand" />
    <meta property="og:title" content="Zero Start" />
    <meta property="og:description" content="Join Zero Club campaigns and grow as a Zero Ambassador." />
    <script>
      /* Paint the account's Zero Club theme before React loads (src/lib/theme.ts). */
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("zs-theme") || "null");
          if (!t) return;
          var dark = t.mode === "on" || (t.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = t.theme === "rose-noir" ? "rose-noir" : "lights-out";
          if (dark) document.documentElement.classList.add("dark", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? (theme === "rose-noir" ? "#0a0409" : "#000000") : "#f8f7f5";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
